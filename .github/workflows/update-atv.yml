name: ATV Güncelle

on:
  schedule:
    # Her Pazar günü saat 03:00'te çalışır (UTC)
    - cron: '0 3 * * 0'
  workflow_dispatch:        # Manuel çalıştırma için

jobs:
  update-atv:
    runs-on: ubuntu-latest
    name: ATV Dizilerini Güncelle
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      
      - name: Run ATV updater
        run: python "atv.py"
      
      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add diziler/atv.json
          git diff --quiet && git diff --staged --quiet || git commit -m "🤖 ATV: Otomatik güncelleme"
          git push
