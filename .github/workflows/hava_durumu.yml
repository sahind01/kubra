name: Hava Durumu Güncelle

on:
  schedule:
    # Her 6 saatte bir güncelle (UTC)
    - cron: '0 */6 * * *'
  push:
    branches: [ main ]
  workflow_dispatch:  # Manuel çalıştırma

jobs:
  update-weather:
    runs-on: ubuntu-latest
    
    steps:
    - name: Kodu indir
      uses: actions/checkout@v4
    
    - name: Python kur
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Gereksinimleri yükle
      run: |
        python -m pip install --upgrade pip
        pip install requests
    
    - name: Hava durumunu güncelle
      run: python hava_durumu.py
    
    - name: Değişiklikleri GitHub'a gönder
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add index.html
        git diff --staged --quiet || git commit -m "Hava durumu güncellendi: $(date +'%Y-%m-%d %H:%M:%S')"
        git push
