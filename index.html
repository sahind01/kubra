
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Türkiye Hava Durumu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: white;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .update-time {
            text-align: center;
            color: rgba(255,255,255,0.8);
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        
        .weather-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }
        
        .weather-card {
            background: rgba(255,255,255,0.95);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .weather-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.3);
        }
        
        .city-name {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        
        .temperature {
            font-size: 2.2em;
            font-weight: bold;
            color: #2d3748;
            margin: 5px 0;
        }
        
        .weather-desc {
            color: #4a5568;
            font-size: 0.95em;
            margin: 5px 0;
        }
        
        .humidity, .wind {
            color: #718096;
            font-size: 0.85em;
            margin: 3px 0;
        }
        
        .weather-icon {
            font-size: 2.5em;
            margin: 5px 0;
        }
        
        @media (max-width: 600px) {
            .weather-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 15px;
            }
            
            h1 {
                font-size: 1.8em;
            }
            
            .temperature {
                font-size: 1.8em;
            }
        }
        
        .error {
            text-align: center;
            color: white;
            font-size: 1.5em;
            padding: 50px;
            background: rgba(255,0,0,0.3);
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌤️ Türkiye Hava Durumu</h1>
        <div class="update-time">📅 Son Güncelleme: 13.07.2026 18:00:41</div>
        <div class="weather-grid">

            <div class="weather-card">
                <div class="city-name">Türkiye Cumhuriyeti</div>
                <div class="weather-icon">🌤️</div>
                <div class="temperature">24.9°C</div>
                <div class="weather-desc">Az Bulutlu</div>
                <div class="humidity">💧 Nem: %32</div>
                <div class="wind">💨 Rüzgar: 3.6 km/s</div>
            </div>

        </div>
    </div>
</body>
</html>
